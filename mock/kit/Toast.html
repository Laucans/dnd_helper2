<!-- Toast: a short message that slides in at a corner and leaves on its own. -->
<style>
.kit-toast { font-family: var(--font-family, system-ui, sans-serif); color: var(--color-text, #202122); }
.kit-toast > button { font: inherit; font-size: var(--font-size-base, 1rem); padding: var(--space-2, 8px) var(--space-3, 16px); border-radius: var(--radius-medium, 4px); border: var(--border-width, 1px) solid var(--color-border, #c8ccd1); background: var(--color-surface-2, #f4f7f9); color: var(--color-text, #202122); cursor: pointer; }
.kit-toast > button:hover { background: var(--color-surface, #ffffff); border-color: var(--color-primary, #006699); }
.kit-toast > button:focus-visible { outline: 2px solid var(--color-primary, #006699); outline-offset: 2px; }
.kit-toast .stack { position: fixed; right: var(--space-4, 24px); bottom: var(--space-4, 24px); display: grid; gap: var(--space-2, 8px); z-index: 30; max-width: calc(100vw - 2 * var(--space-4, 24px)); }
.kit-toast .item { display: flex; align-items: center; gap: var(--space-3, 16px); padding: var(--space-3, 16px) var(--space-4, 24px); background: var(--color-surface, #ffffff); color: var(--color-text, #202122); border: var(--border-width, 1px) solid var(--color-border, #c8ccd1); border-radius: var(--radius-medium, 4px); box-shadow: var(--shadow-high, 0 8px 24px rgba(0, 0, 0, 0.18)); font-family: var(--font-family, system-ui, sans-serif); font-size: var(--font-size-base, 1rem); animation: kit-toast-in .25s ease; border-left: 4px solid var(--color-success, #1f7a4d); }
.kit-toast .item.danger { border-left-color: var(--color-danger, #b32424); }
.kit-toast .item button { margin-left: auto; background: transparent; border: 0; color: var(--color-text-muted, #54595d); cursor: pointer; font-size: var(--font-size-large, 1.25rem); line-height: 1; padding: var(--space-1, 4px); border-radius: var(--radius-small, 2px); }
.kit-toast .item button:hover { color: var(--color-text, #202122); background: var(--color-surface-2, #f4f7f9); }
@keyframes kit-toast-in { from { transform: translateY(12px); opacity: 0; } to { transform: none; opacity: 1; } }
</style>
<div class="kit-toast">
  <button type="button" data-toast="Invoice #2041 saved — $1,280.00">Show a toast</button>
  <div class="stack" aria-live="polite"></div>
</div>
<script>
(() => {
  const root = document.currentScript.closest('[data-kit]') || document.currentScript.parentElement;
  const stack = root.querySelector('.stack');
  const show = (text, danger) => {
    const item = document.createElement('div');
    item.className = 'item' + (danger ? ' danger' : '');
    item.innerHTML = '<span></span><button type="button" aria-label="close">×</button>';
    item.querySelector('span').textContent = text;
    item.querySelector('button').addEventListener('click', () => item.remove());
    stack.appendChild(item);
    setTimeout(() => item.remove(), 4000);
  };
  root.querySelector('[data-toast]').addEventListener('click', (e) => show(e.currentTarget.dataset.toast, false));
})();
</script>
