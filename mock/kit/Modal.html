<!-- Modal: a dialog over the page, opened by a button, closed by its buttons or Escape. -->
<style>
.kit-modal { font-family: var(--font-family, system-ui, sans-serif); color: var(--color-text, #202122); }
.kit-modal > button { font: inherit; font-size: var(--font-size-base, 1rem); padding: var(--space-2, 8px) var(--space-3, 16px); border-radius: var(--radius-medium, 4px); border: var(--border-width, 1px) solid var(--color-primary, #006699); background: var(--color-primary, #006699); color: var(--color-primary-contrast, #ffffff); cursor: pointer; box-shadow: var(--shadow-low, 0 1px 2px rgba(0, 0, 0, 0.12)); }
.kit-modal .backdrop { position: fixed; inset: 0; background: var(--color-text, #202122); opacity: .45; z-index: 20; }
.kit-modal .dialog { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); width: min(420px, 90vw); background: var(--color-surface, #ffffff); border: var(--border-width, 1px) solid var(--color-border, #c8ccd1); border-radius: var(--radius-medium, 4px); box-shadow: var(--shadow-high, 0 8px 24px rgba(0, 0, 0, 0.18)); padding: var(--space-4, 24px); z-index: 21; display: grid; gap: var(--space-3, 16px); }
.kit-modal [hidden] { display: none; }
.kit-modal h2 { margin: 0; padding-bottom: var(--space-2, 8px); border-bottom: var(--border-width, 1px) solid var(--color-border, #c8ccd1); font-family: var(--font-family-heading, Georgia, serif); font-size: var(--font-size-large, 1.25rem); font-weight: var(--font-weight-heading, 700); color: var(--color-text, #202122); }
.kit-modal p { margin: 0; color: var(--color-text-muted, #54595d); font-size: var(--font-size-base, 1rem); line-height: 1.5; }
.kit-modal .actions { display: flex; justify-content: flex-end; gap: var(--space-2, 8px); padding-top: var(--space-2, 8px); }
.kit-modal .actions button { font: inherit; font-size: var(--font-size-base, 1rem); padding: var(--space-2, 8px) var(--space-3, 16px); border-radius: var(--radius-medium, 4px); border: var(--border-width, 1px) solid var(--color-border, #c8ccd1); background: var(--color-surface-2, #f4f7f9); color: var(--color-text, #202122); cursor: pointer; }
.kit-modal .actions .confirm { background: var(--color-danger, #b32424); border-color: var(--color-danger, #b32424); color: var(--color-primary-contrast, #ffffff); }
</style>
<div class="kit-modal">
  <button type="button" data-open>Delete the order…</button>
  <div class="backdrop" data-close hidden></div>
  <div class="dialog" role="dialog" aria-modal="true" aria-labelledby="kit-modal-title" hidden>
    <h2 id="kit-modal-title">Delete this order?</h2>
    <p>Order #1042 for Marie Tremblay ($86.50) leaves the list for good. The customer is not notified.</p>
    <div class="actions"><button type="button" data-close>Keep it</button><button type="button" class="confirm" data-close>Delete</button></div>
  </div>
</div>
<script>
(() => {
  const root = document.currentScript.closest('[data-kit]') || document.currentScript.parentElement;
  const show = (on) => { root.querySelector('.dialog').hidden = !on; root.querySelector('.backdrop').hidden = !on; };
  root.querySelector('[data-open]').addEventListener('click', () => show(true));
  root.querySelectorAll('[data-close]').forEach((b) => b.addEventListener('click', () => show(false)));
  root.ownerDocument.addEventListener('keydown', (e) => { if (e.key === 'Escape') show(false); });
})();
</script>
