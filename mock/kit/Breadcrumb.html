<!-- Breadcrumb: the path to the current page, each step a link. -->
<style>
.kit-breadcrumb { display: inline-block; padding: var(--space-2, 8px) var(--space-3, 16px); background: var(--color-surface-2, #f4f7f9); border: var(--border-width, 1px) solid var(--color-border, #c8ccd1); border-radius: var(--radius-medium, 4px); }
.kit-breadcrumb ol { display: flex; flex-wrap: wrap; align-items: center; gap: var(--space-2, 8px); margin: 0; padding: 0; list-style: none; font-family: var(--font-family, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif); font-size: var(--font-size-small, 0.875rem); }
.kit-breadcrumb li { display: inline-flex; align-items: center; }
.kit-breadcrumb a { color: var(--color-primary, #006699); text-decoration: none; padding: var(--space-1, 4px); border-radius: var(--radius-small, 2px); }
.kit-breadcrumb a:hover { color: var(--color-accent, #990000); text-decoration: underline; }
.kit-breadcrumb a:focus-visible { outline: var(--border-width, 1px) solid var(--color-primary, #006699); outline-offset: 1px; }
.kit-breadcrumb li + li::before { content: '/'; color: var(--color-text-muted, #54595d); margin-right: var(--space-2, 8px); }
.kit-breadcrumb [aria-current="page"] { color: var(--color-text, #202122); font-weight: var(--font-weight-heading, 700); padding: var(--space-1, 4px); }
</style>
<nav class="kit-breadcrumb" aria-label="where you are">
  <ol><li><a href="#">Home</a></li><li><a href="#">Orders</a></li><li><a href="#">2024</a></li><li><span aria-current="page">#2041</span></li></ol>
</nav>
