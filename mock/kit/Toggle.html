<style>
.kit-toggle { display: grid; gap: var(--space-3, 16px); font-family: var(--font-family, system-ui, sans-serif); color: var(--color-text, #202122); font-size: var(--font-size-base, 1rem); background: var(--color-surface, #ffffff); border: var(--border-width, 1px) solid var(--color-border, #c8ccd1); border-radius: var(--radius-medium, 4px); padding: var(--space-3, 16px); }
.kit-toggle label { display: flex; align-items: center; gap: var(--space-3, 16px); cursor: pointer; }
.kit-toggle button { flex: none; width: 44px; height: 24px; border-radius: var(--radius-pill, 999px); border: var(--border-width, 1px) solid var(--color-border, #c8ccd1); padding: 2px; background: var(--color-surface-2, #f4f7f9); cursor: pointer; transition: background .15s, border-color .15s; box-sizing: border-box; display: flex; align-items: center; }
.kit-toggle button i { display: block; width: 18px; height: 18px; border-radius: 50%; background: var(--color-text-muted, #54595d); box-shadow: var(--shadow-low, 0 1px 2px rgba(0, 0, 0, 0.12)); transition: transform .15s, background .15s; }
.kit-toggle button[aria-checked="true"] { background: var(--color-primary, #006699); border-color: var(--color-primary, #006699); }
.kit-toggle button[aria-checked="true"] i { transform: translateX(20px); background: var(--color-primary-contrast, #ffffff); }
.kit-toggle button:focus-visible { outline: 2px solid var(--color-primary, #006699); outline-offset: 2px; }
.kit-toggle button:disabled { opacity: .5; cursor: default; }
.kit-toggle button:disabled + span { color: var(--color-text-muted, #54595d); }
</style>
<div class="kit-toggle">
  <label><button type="button" role="switch" aria-checked="true"><i></i></button><span>Email me a weekly digest</span></label>
  <label><button type="button" role="switch" aria-checked="false"><i></i></button><span>Show prices with tax</span></label>
  <label><button type="button" role="switch" aria-checked="false" disabled><i></i></button><span>Beta features</span></label>
</div>
<script>
(() => {
  const root = document.currentScript.closest('[data-kit]') || document.currentScript.parentElement;
  root.querySelectorAll('[role="switch"]').forEach((b) => b.addEventListener('click', () => b.setAttribute('aria-checked', String(b.getAttribute('aria-checked') !== 'true'))));
})();
</script>
