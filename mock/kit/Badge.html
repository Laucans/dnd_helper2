<style>

.kit-badge span { display: inline-block; font-size: var(--font-size-small, 0.875rem); line-height: 1; padding: var(--space-1, 4px) var(--space-2, 8px); border-radius: var(--radius-medium, 4px); border: var(--border-width, 1px) solid var(--color-border, #c8ccd1); color: var(--color-text-muted, #54595d); background: var(--color-surface-2, #f4f7f9); font-weight: 600; }
