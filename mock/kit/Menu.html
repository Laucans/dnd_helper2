<!-- Menu: a horizontal navigation bar, the brand at the left, the current link marked. -->
<style>
.kit-menu { display: flex; align-items: center; gap: var(--space-4, 24px); padding: var(--space-2, 8px) var(--space-4, 24px); background: var(--color-surface, #ffffff); border-bottom: var(--border-width, 1px) solid var(--color-border, #c8ccd1); font-family: var(--font-family, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif); box-shadow: var(--shadow-low, 0 1px 2px rgba(0, 0, 0, 0.12)); }
.kit-menu .brand { font-family: var(--font-family-heading, Georgia, 'Times New Roman', serif); font-weight: var(--font-weight-heading, 700); font-size: var(--font-size-large, 1.25rem); color: var(--color-accent, #990000); text-decoration: none; letter-spacing: 0.01em; }
.kit-menu nav { display: flex; gap: var(--space-1, 4px); margin-left: var(--space-2, 8px); }
.kit-menu nav a { color: var(--color-text, #202122); text-decoration: none; padding: var(--space-2, 8px) var(--space-3, 16px); border-radius: var(--radius-small, 2px); font-size: var(--font-size-base, 1rem); border-bottom: calc(var(--border-width, 1px) * 2) solid transparent; }
.kit-menu nav a:hover { background: var(--color-surface-2, #f4f7f9); color: var(--color-primary, #006699); }
.kit-menu nav a[aria-current="page"] { color: var(--color-primary, #006699); background: var(--color-surface-2, #f4f7f9); font-weight: var(--font-weight-heading, 700); border-bottom-color: var(--color-primary, #006699); }
.kit-menu .end { margin-left: auto; display: flex; gap: var(--space-2, 8px); }
.kit-menu .end button { font: inherit; font-size: var(--font-size-base, 1rem); padding: var(--space-2, 8px) var(--space-3, 16px); border-radius: var(--radius-small, 2px); border: var(--border-width, 1px) solid var(--color-primary, #006699); background: var(--color-primary, #006699); color: var(--color-primary-contrast, #ffffff); cursor: pointer; }
.kit-menu .end button:hover { background: var(--color-secondary, #2b7a56); border-color: var(--color-secondary, #2b7a56); }
</style>
<header class="kit-menu">
  <a class="brand" href="#">Encyclopédie</a>
  <nav><a href="#" aria-current="page">Accueil</a><a href="#">Catalogue</a><a href="#">Commandes</a><a href="#">Aide</a></nav>
  <div class="end"><button type="button">Connexion</button></div>
</header>
