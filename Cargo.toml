[workspace]
resolver = "3"
members = [
    "crates/campagne/capabilities/lister-campagnes",
    "crates/campagne/capabilities/lister-pjs",
    "crates/campagne/capabilities/niveau-du-groupe",
    "crates/campagne/persisted-query",
    "crates/campagne/serveur",
    "crates/dataguard",
    "crates/dataguard/data-capabilities/ajouter-pj",
    "crates/dataguard/data-capabilities/archiver-campagne",
    "crates/dataguard/data-capabilities/archiver-pj",
    "crates/dataguard/data-capabilities/creer-campagne",
    "crates/dataguard/data-capabilities/modifier-pj",
]

[workspace.package]
edition = "2024"
rust-version = "1.94"
publish = false

[workspace.dependencies]
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "json"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
hex = "0.4"
serde = { version = "1", features = ["derive"] }
# Never `arbitrary_precision`: a level of `5.0` must stay a float.
serde_json = "1"
sha2 = "0.11"
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "postgres", "uuid", "json", "chrono"] }
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "time", "sync"] }
tokio-stream = { version = "0.1", features = ["sync"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "env-filter", "ansi"] }
unicode-normalization = "0.1"
uuid = { version = "1", features = ["v4", "serde"] }

# Test-only.
# No HTTP or file resolver: the contracts are read from disk by the tests.
jsonschema = { version = "0.58", default-features = false }
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }
