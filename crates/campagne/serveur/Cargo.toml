[package]
name = "campagne-serveur"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
build = "build.rs"

[lib]
name = "campagne_serveur"
path = "src/lib.rs"

[[bin]]
name = "campagne-serveur"
path = "src/main.rs"

[dependencies]
archiver-campagne = { path = "../../dataguard/data-capabilities/archiver-campagne" }
archiver-pj = { path = "../../dataguard/data-capabilities/archiver-pj" }
axum.workspace = true
dataguard = { path = "../../dataguard" }
hex.workspace = true
modifier-pj = { path = "../../dataguard/data-capabilities/modifier-pj" }
serde_json.workspace = true
sha2.workspace = true
sqlx.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-stream.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
chrono.workspace = true
http-body-util.workspace = true
jsonschema.workspace = true
tokio = { workspace = true, features = ["process", "time", "io-util"] }
tower.workspace = true
uuid.workspace = true
